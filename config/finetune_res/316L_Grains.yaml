generator:
  name: "NAFNet"
  args:
    segmentation: false
    img_channel: 1

discriminator:
  name: "Discriminator"
  args:
    in_channels: 1
    use_sigmoid: true
    use_spectral_norm: true
    init_weights: true

dataset:
  name: 316L_Grains
  csv_dir_path: "dataset/316L_Grains/cv_res"
  input_col: "photo_path"
  target_col: "mask_path"

training:
  epochs: 6
  batch_size: 4
  accumulation_steps: 4 # batch_size * accumulation_steps = effective batch size
  num_classes: 2
  num_folds: 5 # Cross validation
  save_start_epoch: 7 # Save only the latest checkpoint
  finetune: true
  pretrained_dir: "results_res/316L_Grains/NAFNet"

loss:
  gan_loss_weight: 1
  dis_loss_weight: 1
  topo_loss_weight: 0.001
  topo_size: 200
  BCE_loss_weight: 1
  BCE_pos_weight: 2
  gan_loss_type: "nsgan"

gen_optimizer:
  lr: 0.0001
  weight_decay: 0
  betas: [0.9, 0.999]

dis_optimizer:
  lr: 0.00001
  weight_decay: 0
  betas: [0.9, 0.999]

gen_scheduler:
  flg: true
  eta_min: 0.000001

dis_scheduler:
  flg: false
  eta_min: 0.000001